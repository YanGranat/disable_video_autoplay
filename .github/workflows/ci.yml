name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install chromium --no-shell
      - name: Test packaging
        if: runner.os == 'Linux'
        run: npm run test:package
      - name: Test packaged extension in Chromium
        if: runner.os == 'Linux'
        env:
          YTAP_EXTENSION_ROOT: ${{ github.workspace }}/temporary_files/extension
        run: |
          npm run package -- --output temporary_files/extension.zip --extract-to temporary_files/extension
          npm run test:browser
